# Enable per-listener settings
per_listener_settings true

# Basic listener configuration
listener 1883 0.0.0.0
allow_anonymous true

# Authenticated listener på port 8883 (SSL/TLS)
listener 8883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/password.txt

# SSL/TLS certifikater
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# TLS version (valgfrit, kun moderne versioner)
tls_version tlsv1.2

# WebSocket listener
# listener 9001
# protocol websockets
# allow_anonymous true

# Enable persistence
persistence true
persistence_location /mosquitto/data/

# Save to disk every 300 seconds
autosave_interval 300

# Keep messages for offline clients
persistent_client_expiration 7d

# Logging
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information