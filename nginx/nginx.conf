server {
    listen 80;
    server_name _;
    
    location / {
        root /usr/share/nginx/html;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        
        # Vis .jsonl filer som tekst
        types {
            text/plain jsonl;
        }
        
        charset utf-8;
        
        # CORS hvis eleverne skal tilgå fra andre domæner
        add_header Access-Control-Allow-Origin *;
    }
}
